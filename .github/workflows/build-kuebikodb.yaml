name: Build KuebikoDB

on:
  workflow_call:
    inputs:
      build_mode:
        description: 'the build mode'
        type: string
        required: true
      enable_ccache:
        description: 'enable ccache for non-reproducibility builds'
        type: boolean
        default: true
    outputs:
      md5sum:
        description: 'the md5sum for the inherited database executable'
        value: ${{ jobs.build.outputs.md5sum }}

jobs:
  build:
    runs-on: depot-ubuntu-24.04-8
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      NODISTCC: true
    outputs:
      md5sum: ${{ steps.checksum.outputs.md5sum }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@v3
      - name: Restore ccache
        if: ${{ inputs.enable_ccache }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-build-kuebikodb-${{ inputs.build_mode }}-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-build-kuebikodb-${{ inputs.build_mode }}-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}-
            ccache-${{ runner.os }}-build-kuebikodb-${{ inputs.build_mode }}-
            ccache-${{ runner.os }}-build-kuebikodb-
      - name: Configure ccache
        if: ${{ inputs.enable_ccache }}
        run: |
          mkdir -p "$CCACHE_DIR"
          nix develop .#cpp -c ccache --max-size="$CCACHE_MAXSIZE"
          nix develop .#cpp -c ccache --zero-stats
      - name: Generate the building system
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          nix develop .#cpp -c ./configure.py --mode ${{ inputs.build_mode }} --with scylla
      - run: |
          nix develop .#cpp -c ninja build/${{ inputs.build_mode }}/scylla
      - id: checksum
        run: |
          checksum=$(md5sum build/${{ inputs.build_mode }}/scylla | cut -c -32)
          echo "md5sum=$checksum" >> $GITHUB_OUTPUT
      - name: Show ccache stats
        if: ${{ always() && inputs.enable_ccache }}
        run: |
          nix develop .#cpp -c ccache --show-stats
