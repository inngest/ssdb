# SPDX-License-Identifier: Apache-2.0

name: KuebikoDB Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cxx-configure:
    name: C++ configure smoke
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@v3
      - name: Configure inherited C++ build
        run: make cpp-configure

  kuebikodb-build:
    name: Build KuebikoDB
    uses: ./.github/workflows/build-kuebikodb.yaml
    with:
      build_mode: dev

  rust:
    name: Rust checks and tests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v3
      - name: Check Rust formatting
        run: make rust-fmt-check
      - name: Check Rust workspace
        run: make rust-check
      - name: Test Rust workspace
        run: make rust-test
