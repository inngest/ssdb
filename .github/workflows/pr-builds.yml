# SPDX-License-Identifier: Apache-2.0

name: ssdb Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: depot-ubuntu-24.04
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      regression: ${{ steps.filter.outputs.regression }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: .github/scripts/ci-changes.sh

  ssdb-build:
    name: Build ssdb
    needs: changes
    if: needs.changes.outputs.cpp == 'true' || needs.changes.outputs.regression == 'true'
    uses: ./.github/workflows/build-ssdb.yaml
    with:
      build_mode: dev
      run_smoke_tests: true
      regression_suites: ${{ needs.changes.outputs.regression == 'true' && 'alternator/ auth_cluster/ boost/ broadcast_tables/ cql/ cql-pytest/ nodetool/ object_store/ pylib_test/ raft/ rest_api/ scylla_gdb/ topology/ topology_custom/ topology_experimental_raft/ topology_random_failures/ topology_tasks/ unit/' || '' }}

  rust:
    name: Rust checks and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Check Rust formatting
        run: make rust-fmt-check
      - name: Check Rust workspace
        run: make rust-check
      - name: Test Rust workspace
        run: make rust-test
