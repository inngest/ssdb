# SPDX-License-Identifier: Apache-2.0

name: KuebikoDB Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-toolchain:
    name: Read C++ toolchain
    uses: ./.github/workflows/read-toolchain.yaml

  submodules:
    name: Submodule checkout
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

  cxx-configure:
    name: C++ configure smoke
    needs:
      - read-toolchain
    runs-on: depot-ubuntu-24.04
    container: ${{ needs.read-toolchain.outputs.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure inherited C++ build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./configure.py --mode dev --with scylla --disable-dpdk

  kuebikodb-build:
    name: Build KuebikoDB
    uses: ./.github/workflows/build-kuebikodb.yaml
    with:
      build_mode: dev

  rust:
    name: Rust checks and tests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: Check Rust workspace
        run: cargo check --locked --manifest-path rust/Cargo.toml
      - name: Test Rust workspace
        run: cargo test --locked --manifest-path rust/Cargo.toml

  nix:
    name: Nix flake check
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check Linux flake outputs
        run: nix flake check --system x86_64-linux --print-build-logs
