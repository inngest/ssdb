name: Build ssdb

on:
  workflow_call:
    inputs:
      build_mode:
        description: 'the build mode'
        type: string
        required: true
      enable_ccache:
        description: 'enable ccache for non-reproducibility builds'
        type: boolean
        default: true
      run_smoke_tests:
        description: 'run a focused inherited test binary after building'
        type: boolean
        default: false
      regression_suites:
        description: 'space-separated test.py regression suites to run after building'
        type: string
        default: ''
    outputs:
      md5sum:
        description: 'the md5sum for the inherited database executable'
        value: ${{ jobs.build.outputs.md5sum }}

jobs:
  build:
    runs-on: depot-ubuntu-24.04-8
    env:
      CCACHE_MAXSIZE: 5G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      NODISTCC: true
    outputs:
      md5sum: ${{ steps.checksum.outputs.md5sum }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Restore ccache
        if: ${{ inputs.enable_ccache }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-build-ssdb-${{ inputs.build_mode }}-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-build-ssdb-${{ inputs.build_mode }}-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}-
            ccache-${{ runner.os }}-build-ssdb-${{ inputs.build_mode }}-
            ccache-${{ runner.os }}-build-ssdb-
      - name: Configure ccache
        if: ${{ inputs.enable_ccache }}
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          nix develop .#cpp -c ccache --max-size="$CCACHE_MAXSIZE"
          nix develop .#cpp -c ccache --zero-stats
      - name: Generate the building system
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          artifacts=(--with scylla)
          if [ "${{ inputs.run_smoke_tests }}" = "true" ]; then
            artifacts+=(--with test/boost/UUID_test)
          fi
          # The .#cpp shell's compiler wrappers use ccache when CCACHE_DIR is set.
          nix develop .#cpp -c ./configure.py --mode ${{ inputs.build_mode }} "${artifacts[@]}" --no-seastar-unused-result-error
      - run: |
          nix develop .#cpp -c ninja build/${{ inputs.build_mode }}/scylla
      - name: Build inherited smoke tests
        if: ${{ inputs.run_smoke_tests }}
        run: |
          nix develop .#cpp -c ninja build/${{ inputs.build_mode }}/test/boost/UUID_test
      - name: Run inherited smoke tests
        if: ${{ inputs.run_smoke_tests }}
        run: |
          nix develop .#cpp -c env LD_LIBRARY_PATH="$PWD/build/${{ inputs.build_mode }}/seastar${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" build/${{ inputs.build_mode }}/test/boost/UUID_test \
            --report_level=no \
            --catch_system_errors=no \
            --color_output=false \
            -- \
            --overprovisioned \
            --unsafe-bypass-fsync 1 \
            --kernel-page-cache 1 \
            --blocked-reactor-notify-ms 2000000 \
            --collectd 0 \
            --max-networking-io-control-blocks=100
      - name: Run regression tests
        if: ${{ inputs.regression_suites != '' }}
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: |
          regression_ld_path="$PWD/build/${{ inputs.build_mode }}/seastar${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          nix develop .#cpp -c env LD_LIBRARY_PATH="$regression_ld_path" uv run --locked --group test ./test.py \
            --mode "${{ inputs.build_mode }}" \
            --jobs 4 \
            --timeout 3600 \
            --markers "not veryslow" \
            ${{ inputs.regression_suites }}
      - name: Upload test logs
        if: ${{ always() && (inputs.run_smoke_tests || inputs.regression_suites != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ inputs.build_mode }}
          path: testlog
          if-no-files-found: ignore
      - id: checksum
        run: |
          checksum=$(md5sum build/${{ inputs.build_mode }}/scylla | cut -c -32)
          echo "md5sum=$checksum" >> $GITHUB_OUTPUT
      - name: Show ccache stats
        if: ${{ always() && inputs.enable_ccache }}
        run: |
          nix develop .#cpp -c ccache --show-stats
