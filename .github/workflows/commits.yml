name: PR Conventional Commit Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: depot-ubuntu-24.04
    steps:
      # ref: https://github.com/marketplace/actions/conventional-commit-in-pull-requests
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@1.5.2
        with:
          task_types: '["feat","fix","docs","doc","test","ci","build","refactor","perf","chore","revert","style","security"]'
