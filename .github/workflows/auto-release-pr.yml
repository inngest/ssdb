# SPDX-License-Identifier: Apache-2.0

name: Auto-create Release PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

concurrency:
  group: release-pr-main
  cancel-in-progress: true

jobs:
  create-release-pr:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Validate release token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=Missing RELEASE_TOKEN::Configure a release bot token as the RELEASE_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Skip release commits
        id: skip
        run: |
          if git log -1 --pretty=%s | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check for unreleased commits
        if: steps.skip.outputs.skip == 'false'
        id: changes
        run: |
          git fetch --tags origin
          latest_tag="$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          head_sha="$(git rev-parse HEAD)"
          head_short_sha="$(git rev-parse --short HEAD)"

          if [ -n "${latest_tag}" ]; then
            ahead="$(git rev-list --count "${latest_tag}"..HEAD)"
            release_range="${latest_tag}..HEAD"
            compare_url="${{ github.server_url }}/${{ github.repository }}/compare/${latest_tag}...${head_sha}"
            compare_label="${latest_tag}...${head_short_sha}"
          else
            ahead="$(git rev-list --count HEAD)"
            release_range="HEAD"
            compare_url=""
            compare_label=""
          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          echo "release_range=${release_range}" >> "$GITHUB_OUTPUT"
          echo "compare_url=${compare_url}" >> "$GITHUB_OUTPUT"
          echo "compare_label=${compare_label}" >> "$GITHUB_OUTPUT"

      - name: Compute next release tag
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: next-version
        env:
          LATEST_TAG: ${{ steps.changes.outputs.latest_tag }}
        run: |
          if ! printf '%s\n' "${LATEST_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Latest release tag is not a semver tag: ${LATEST_TAG:-none}"
            exit 1
          fi

          major="$(printf '%s\n' "${LATEST_TAG}" | sed -E 's/^v([0-9]+)\.[0-9]+\.[0-9]+$/\1/')"
          minor="$(printf '%s\n' "${LATEST_TAG}" | sed -E 's/^v[0-9]+\.([0-9]+)\.[0-9]+$/\1/')"
          patch="$(printf '%s\n' "${LATEST_TAG}" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')"
          next_patch="$((patch + 1))"
          tag_name="v${major}.${minor}.${next_patch}"
          echo "tag=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.next-version.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create or update release branch
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          branch="release/next"

          git checkout -B "${branch}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Release branch already matches generated files"
          else
            git commit -m "chore(release): ${RELEASE_TAG}"
          fi

          git push --force-with-lease origin "${branch}"

      - name: Create PR body
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
          LATEST_TAG: ${{ steps.changes.outputs.latest_tag }}
          AHEAD: ${{ steps.changes.outputs.ahead }}
          COMPARE_URL: ${{ steps.changes.outputs.compare_url }}
          COMPARE_LABEL: ${{ steps.changes.outputs.compare_label }}
        run: |
          awk -v version="## [${RELEASE_TAG}]" '
            index($0, version) == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes-preview.md

          {
            echo "<!-- auto-release-pr -->"
            echo "## Release"
            echo
            echo "This PR prepares \`${RELEASE_TAG}\`."
            echo
            echo "- Commits since last tag: ${AHEAD}"
            echo "- Previous tag: \`${LATEST_TAG:-none}\`"
            if [ -n "${COMPARE_URL}" ]; then
              echo "- Compare: [${COMPARE_LABEL}](${COMPARE_URL})"
            fi
            echo "- Source branch: \`release/next\`"
            echo "- Base branch: \`${{ github.event.repository.default_branch }}\`"
            echo
            echo "## Notes Preview"
            echo
            cat /tmp/release-notes-preview.md
          } > /tmp/release-pr-body.md

      - name: Find existing release PR
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: existing-pr
        run: |
          pr_number="$(gh pr list \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Create release PR
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.existing-pr.outputs.pr_number == ''
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md

      - name: Update existing release PR
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.existing-pr.outputs.pr_number != ''
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          gh pr edit "${{ steps.existing-pr.outputs.pr_number }}" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md
