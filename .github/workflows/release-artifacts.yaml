# SPDX-License-Identifier: Apache-2.0

name: Release Artifacts

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9][0-9]"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 8G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      NODISTCC: true
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq '^v[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{2}$'; then
            echo "Release tag is not valid: ${RELEASE_TAG}"
            exit 1
          fi

          date_stamp="$(printf '%s\n' "${RELEASE_TAG}" | sed -E 's/^v([0-9]{4})-([0-9]{2})-([0-9]{2})\.[0-9]{2}$/\1\2\3/')"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "date_stamp=${date_stamp}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-release-${{ steps.tag.outputs.tag }}-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}
          restore-keys: |
            ccache-${{ runner.os }}-release-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}-
            ccache-${{ runner.os }}-release-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          nix develop .#cpp -c ccache --max-size="$CCACHE_MAXSIZE"
          nix develop .#cpp -c ccache --zero-stats

      - name: Build release artifacts
        run: make release-artifacts RELEASE_DATE_STAMP=${{ steps.tag.outputs.date_stamp }}

      - name: Inspect server linkage
        run: |
          file build/release/scylla
          nix develop .#cpp -c ldd build/release/scylla

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          find build/release/dist/tar build/dist/release/debian build/dist/release/redhat \
            -type f \( \
              -name '*.tar.gz' -o \
              -name '*.deb' -o \
              -name '*.ddeb' -o \
              -name '*.rpm' -o \
              -name '*.dsc' -o \
              -name '*.changes' -o \
              -name '*.buildinfo' \
            \) -print -exec cp {} release-artifacts/ \;
          shasum -a 256 release-artifacts/* > release-artifacts/checksums.txt

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          changelog_version="${RELEASE_TAG#v}"
          awk -v version="## [${changelog_version}]" '
            $0 == version { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "## ${RELEASE_TAG}"
              echo
              echo "Release artifacts were built from ${RELEASE_TAG}."
            } > RELEASE_NOTES.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ssdb-${{ steps.tag.outputs.tag }}-release-artifacts
          path: release-artifacts/
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
          fail_on_unmatched_files: true

      - name: Show ccache stats
        if: always()
        run: nix develop .#cpp -c ccache --show-stats
