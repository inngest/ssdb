# SPDX-License-Identifier: Apache-2.0

name: Release Artifacts

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-artifacts-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            runner: depot-ubuntu-24.04-8
          - arch: aarch64
            docker_arch: arm64
            runner: depot-ubuntu-24.04-arm-8
    env:
      CCACHE_MAXSIZE: 8G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      NODISTCC: true
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag is not valid: ${RELEASE_TAG}"
            exit 1
          fi

          date_stamp="$(date -u +%Y%m%d)"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "date_stamp=${date_stamp}" >> "$GITHUB_OUTPUT"
          image_name="$(printf 'ghcr.io/%s\n' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-release-${{ steps.tag.outputs.tag }}-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-release-${{ hashFiles('flake.nix', 'flake.lock', 'configure.py', 'CMakeLists.txt', 'cmake/**', '.gitmodules') }}-
            ccache-${{ runner.os }}-${{ matrix.arch }}-release-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          nix develop .#cpp -c ccache --max-size="$CCACHE_MAXSIZE"
          nix develop .#cpp -c ccache --zero-stats

      - name: Build release artifacts
        run: make release-artifacts RELEASE_DATE_STAMP=${{ steps.tag.outputs.date_stamp }}

      - name: Inspect server linkage
        run: |
          file build/release/scylla
          nix develop .#cpp -c ldd build/release/scylla

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          find build/release/dist/tar build/dist/release/debian build/dist/release/redhat \
            -type f \( \
              -name '*.tar.gz' -o \
              -name '*.deb' -o \
              -name '*.ddeb' -o \
              -name '*.rpm' -o \
              -name '*.dsc' -o \
              -name '*.changes' -o \
              -name '*.buildinfo' \
            \) -print -exec cp {} release-artifacts/ \;

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dist/docker/debian/Dockerfile.release
          platforms: linux/${{ matrix.docker_arch }}
          push: true
          build-args: |
            RELEASE=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.tag }}-${{ matrix.docker_arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: ssdb-${{ steps.tag.outputs.tag }}-${{ matrix.arch }}-release-artifacts
          path: release-artifacts/
          if-no-files-found: error

      - name: Show ccache stats
        if: always()
        run: nix develop .#cpp -c ccache --show-stats

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! printf '%s\n' "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag is not valid: ${RELEASE_TAG}"
            exit 1
          fi

          image_name="$(printf 'ghcr.io/%s\n' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ssdb-${{ steps.tag.outputs.tag }}-*-release-artifacts
          path: release-artifacts
          merge-multiple: true

      - name: Write checksums
        run: |
          find release-artifacts -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > release-artifacts/checksums.txt

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_NAME: ${{ steps.tag.outputs.image_name }}
        run: |
          awk -v version="## [${RELEASE_TAG}]" '
            index($0, version) == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "## ${RELEASE_TAG}"
              echo
              echo "Release artifacts were built from ${RELEASE_TAG}."
            } > RELEASE_NOTES.md
          fi

          {
            echo
            echo "## Container Image"
            echo
            echo "- \`${IMAGE_NAME}:${RELEASE_TAG}\`"
            echo "- \`${IMAGE_NAME}:${RELEASE_TAG}-amd64\`"
            echo "- \`${IMAGE_NAME}:${RELEASE_TAG}-arm64\`"
          } >> RELEASE_NOTES.md

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-arch image tags
        env:
          IMAGE_NAME: ${{ steps.tag.outputs.image_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${RELEASE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            "${IMAGE_NAME}:${RELEASE_TAG}-arm64"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
          fail_on_unmatched_files: true
