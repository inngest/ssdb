# SPDX-License-Identifier: Apache-2.0

[project]
name = "ssdb-python"
version = "0.0.0"
description = "Python tooling, test, documentation, and packaging dependencies for ssdb"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "boto3",
    "click",
    "colorama",
    "distro",
    "geomet>=0.1,<0.3",
    "humanfriendly",
    "jinja2",
    "psutil",
    "pyparsing",
    "python-magic",
    "pyudev; sys_platform == 'linux'",
    "pyyaml",
    "requests",
    "scylla-api-client",
    "scylla-driver",
    "setuptools",
    "six",
    "tabulate",
    "traceback-with-variables",
    "treelib",
    "unidiff",
    "urwid",
]

[dependency-groups]
test = [
    "allure-pytest",
    "pytest",
    "pytest-asyncio",
    "pytest-flake8",
    "redis",
]
docs = [
    "pygments==2.15.1",
    "redirects-cli~=0.1.2",
    "sphinx==7.2.6",
    "sphinx-autobuild==2021.3.14",
    "sphinx-collapse>=0.1.3,<0.2.0",
    "sphinx-multiversion-scylla~=0.3.1",
    "sphinx-scylladb-markdown>=0.1.2,<0.2.0",
    "sphinx-scylladb-theme>=1.7.1,<2.0.0",
    "sphinx-sitemap==2.5.1",
    "sphinxcontrib-datatemplates>=0.9.2,<0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
flake8-ignore = [
    "E501",
]
